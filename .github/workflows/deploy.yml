name: Deploy

# Deploy-on-merge: when a PR (including one the bot opened via propose_change)
# is merged to the default branch, typecheck then deploy to Cloudflare. The
# human review/merge is the gate — the bot proposes, a person merges, CI ships.
# Manual runs are allowed via the Actions tab (workflow_dispatch).
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate the deploy on a clean typecheck and passing tests, so a bad merge
      # (including a bot-merged self-PR) can't ship.
      - run: pnpm typecheck
      - run: pnpm test

      # Builds the Worker + Sandbox container image and deploys. Existing
      # secrets (GITHUB_TOKEN, BRAVE_API_KEY, TELEGRAM_*) persist on the Worker
      # across deploys, so only the deploy credentials are needed here.
      - uses: cloudflare/wrangler-action@v4
        with:
          # v4 defaults to Wrangler v4; pin the exact version for reproducible
          # CI matching the project's lockfile (and to parse wrangler.jsonc).
          wranglerVersion: "4.100.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
